<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebView Test Page</title>
<style>
  body{margin:0;background:#1b2838;color:#fff;font-family:monospace;padding:18px}
  h1{font-size:22px;margin:0 0 6px} h2{font-size:16px;margin:0 0 16px;font-weight:normal;color:#9db}
  .k{color:#cfe;font-size:15px;line-height:1.6;word-break:break-all}
  b{color:#7fd}
</style>
</head>
<body>
  <h1>WebView Rendering Test</h1>
  <h2>Client-side context report</h2>
  <div class="k" id="out">running…</div>
  <script>
    var domain = document.domain;
    var href   = location.href;
    var ua     = navigator.userAgent;

    // beacon back to this origin (image request = no CORS needed)
    try {
      var b = new Image();
      b.src = "/beacon.gif?d=" + encodeURIComponent(
                "domain="+domain+"|href="+href+"|ua="+ua+"|ts="+Date.now());
    } catch(e){}

    document.getElementById('out').innerHTML =
        "location.href = <b>"+href+"</b><br>"+
        "document.domain = <b>"+domain+"</b><br>"+
        "script executed = <b>true</b><br>"+
        "alert() reachable = <b>"+(typeof window.alert==='function')+"</b><br>"+
        "userAgent = "+ua;

    try { alert("script executed\ndomain=" + domain); } catch(e){}
  </script>
</body>
</html>
